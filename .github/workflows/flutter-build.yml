name: Flutter Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          rm -rf android ios web linux macos windows test
          flutter create . --org com.bajrangelectric --project-name nutrition_tracker --platforms android

      - name: Copy app files
        run: |
          cp -f pubspec.yaml /tmp/pubspec.yaml.bak || true
          # Restore our files after create
          git checkout -- pubspec.yaml lib/ README.md assets/ logo.png .github/ 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
