name: Flutter Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Clean and recreate Android
        run: |
          rm -rf android ios web linux macos windows test build .dart_tool .packages .metadata
          flutter create . --org com.bajrangelectric --project-name nutrition_tracker --platforms android

      - name: Restore source files
        run: |
          cp -r lib/ lib_backup/ 2>/dev/null || true
          cp -r assets/ assets_backup/ 2>/dev/null || true
          cp README.md README.md.bak 2>/dev/null || true
          cp pubspec.yaml pubspec.yaml.bak 2>/dev/null || true
          cp logo.png logo.png.bak 2>/dev/null || true
          git checkout -- lib/ assets/ pubspec.yaml README.md logo.png 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
