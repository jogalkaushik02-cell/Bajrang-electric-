name: Flutter Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          rm -rf android ios web linux macos windows test
          flutter create . --org com.bajrangelectric --project-name nutrition_tracker --platforms android

      - name: Restore app files
        run: |
          git checkout HEAD -- pubspec.yaml lib/ README.md assets/ logo.png 2>/dev/null || cp -r $(git rev-parse --show-toplevel)/../Bajrang-electric-/lib . 2>/dev/null || true
          git show HEAD:pubspec.yaml > pubspec.yaml || true
          git show HEAD:lib/main.dart > lib/main.dart || true
          git show HEAD:assets/logo.png > assets/logo.png 2>/dev/null || true
          git show HEAD:logo.png > logo.png 2>/dev/null || true
          git show HEAD:README.md > README.md || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
